[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flmh-agent"
version = "0.1.0"
description = "LangGraph agent application for FLMH product research and content production"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "cryptography==50.0.2",
  "langgraph==1.2.22",
  "mcp==1.30.0",
  "pydantic==2.14.3",
  "python-dotenv==1.2.4",
  "sqlglot==30.32.0",
  "starlette==1.10.0",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
postgres = ["langgraph-checkpoint-postgres==3.2.1", "psycopg[binary,pool]==3.3.9", "asyncpg==0.32.0"]
observability = ["langfuse==3.15.0", "langchain==1.5.0"]

[project.scripts]
flmh-agent = "flmh_agent.cli:main"
flmh-agent-api = "flmh_agent.api:main"
flmh-mcp-bridge = "flmh_agent.adapters.inbound.mcp_tools:main"

[tool.setuptools.packages.find]
include = ["flmh_agent*"]
